[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingbot-recap"
version = "0.1.0"
description = "Safe human-intervention collection for LingBot VLA on SO-101"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "requests>=2.31",
]

[project.optional-dependencies]
robot = ["opencv-python>=4.8", "lerobot==0.4.2"]
dev = ["pytest>=8"]

[project.scripts]
lingbot-recap = "lingbot_recap.cli:main"

[tool.setuptools.packages.find]
include = ["lingbot_recap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
